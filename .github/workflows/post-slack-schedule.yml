name: Post Daily Schedule to Slack

on:
  schedule:
       - cron: '50 14 * * *'  # Temporary test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Post schedule to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/post-slack-schedule.js

      - name: Commit used-years.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/used-years.json
          git diff --staged --quiet || git commit -m "Update used-years.json [skip ci]"
          git push
