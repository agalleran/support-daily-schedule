name: Post Daily Schedule to Slack

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 7am PT (2pm UTC) Monday–Friday only
  workflow_dispatch:          # Allow manual trigger for testing

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Post schedule to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/post-slack-schedule.js
