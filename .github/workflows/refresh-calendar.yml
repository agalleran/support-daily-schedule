name: Refresh OOO from Google Calendar

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 6am UTC (11pm PT)
  workflow_dispatch:       # Also allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install googleapis

      - name: Run calendar refresh script
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: node scripts/refresh-calendar.js

      - name: Commit updated data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-refresh OOO data from Google Calendar"
          git push
